<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AtomicIncrement - Rust training and Consultancy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['JetBrains Mono', 'Fira Code', 'Monaco', 'Consolas', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Hexagon shapes */
        .hexagon {
            position: relative;
            transform: rotate(30deg);
        }
        
        .hexagon:before,
        .hexagon:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            border: inherit;
            transform: rotate(60deg);
        }
        
        .hexagon:after {
            transform: rotate(-60deg);
        }
        
        /* Enhanced animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
                opacity: 1;
            }
            50% { 
                box-shadow: 0 0 5px currentColor, 0 0 10px currentColor, 0 0 15px currentColor;
                opacity: 0.8;
            }
        }
        
        @keyframes data-flow {
            0% { transform: translateX(-100%) scaleX(0); }
            50% { transform: translateX(0%) scaleX(1); }
            100% { transform: translateX(100%) scaleX(0); }
        }
        
        /* Hero tech visualization */
        .hero-tech-visualization {
            animation: subtle-pulse 4s ease-in-out infinite;
        }
        
        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        /* Network connection animations */
        .network-line {
            animation: network-pulse 3s ease-in-out infinite;
        }
        
        @keyframes network-pulse {
            0%, 100% { stroke-opacity: 0.3; }
            50% { stroke-opacity: 0.8; }
        }
        
        /* Floating particle animation */
        .floating-particle {
            animation: float-particle 6s ease-in-out infinite;
        }
        
        @keyframes float-particle {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(0deg); 
                opacity: 0.6;
            }
            33% { 
                transform: translateY(-15px) translateX(10px) rotate(120deg); 
                opacity: 1;
            }
            66% { 
                transform: translateY(-5px) translateX(-10px) rotate(240deg); 
                opacity: 0.8;
            }
        }
        
        /* Improved button hover effects */
        .group:hover .group-hover\:translate-x-1 {
            transform: translateX(0.25rem);
        }
        
        /* Focus improvements for accessibility */
        .focus-visible\:outline:focus-visible {
            outline: 2px solid;
            outline-offset: 2px;
        }
        
        /* Responsive text scaling */
        @media (max-width: 640px) {
            .hero-tech-visualization {
                animation-duration: 6s; /* Slower on mobile for better performance */
            }
        }
        
        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .hero-tech-visualization,
            .floating-particle,
            .network-line,
            .animate-spin,
            .animate-pulse,
            .animate-ping,
            .animate-bounce {
                animation: none;
            }
            
            html {
                scroll-behavior: auto;
            }
        }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z"/>
</head>
<body>
</body>
</html>
